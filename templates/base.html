<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analiza portfela MAC{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <nav class="topnav">
    <span class="brand">📊 Analiza portfela <b>MAC</b></span>
    <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Pary transakcji</a>
    <a href="/portfel" class="{{ 'active' if request.path == '/portfel' else '' }}">Portfel</a>
    <span class="wallet mono" title="{{ wallet }}">{{ wallet[:4] }}…{{ wallet[-4:] }}</span>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <div id="toasts"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
